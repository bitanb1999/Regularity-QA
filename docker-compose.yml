services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER} -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 10s
      retries: 10


  # --- the application: docker compose up -d --build (API :8000, UI :8501) ---
  api:
    build: .
    image: regulatory-qa:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network services are reached by name on their container ports;
      # this overrides the host-side values in .env (e.g. POSTGRES_PORT=5433).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      NEO4J_URI: bolt://neo4j:7687
      LANGFUSE_BASE_URL: http://langfuse-web:3000
    volumes:
      - ./data:/app/data  # raw letters + cached extractions, for POST /ingest
    ports:
      - "8000:8000"
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 5

  ui:
    image: regulatory-qa:latest
    restart: unless-stopped
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.port", "8501",
              "--server.address", "0.0.0.0", "--server.headless", "true",
              "--browser.gatherUsageStats", "false"]
    environment:
      RQA_API_URL: http://api:8000              # server-side calls from the Streamlit process
      LANGFUSE_BASE_URL: http://localhost:3000  # trace links opened by the user's browser
    ports:
      - "8501:8501"
    depends_on:
      api: {condition: service_healthy}

  # --- Langfuse tracing (optional): docker compose --profile observability up -d ---
  # Adapted from the official langfuse/langfuse docker-compose.yml (v4). All Langfuse settings use
  # LANGFUSE_* variables so they can't collide with this project's POSTGRES_* ones, and only the
  # web UI (3000) and MinIO media endpoint (9090) are published.
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    profiles: [observability]
    restart: unless-stopped
    depends_on: &langfuse-depends-on
      langfuse-db: {condition: service_healthy}
      langfuse-minio: {condition: service_healthy}
      langfuse-redis: {condition: service_healthy}
      langfuse-clickhouse: {condition: service_healthy}
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH}

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    profiles: [observability]
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - "3000:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      # Headless setup: org, project, API keys and a login user are created on first start.
      LANGFUSE_INIT_ORG_ID: regulatory-qa
      LANGFUSE_INIT_ORG_NAME: Regulatory QA
      LANGFUSE_INIT_PROJECT_ID: regulatory-qa
      LANGFUSE_INIT_PROJECT_NAME: regulatory-qa
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}

  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    profiles: [observability]
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    profiles: [observability]
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD}
    ports:
      - "127.0.0.1:9090:9000"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10

  langfuse-redis:
    image: docker.io/redis:7
    profiles: [observability]
    restart: unless-stopped
    command: --requirepass ${LANGFUSE_REDIS_AUTH} --maxmemory-policy noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_AUTH}", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  langfuse-db:
    image: docker.io/postgres:17
    profiles: [observability]
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  neo4jdata:
  langfuse_db_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
